<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curd Operation Using JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <div class="container text-center">
            <div class="row">
                <h1>My WatchList</h1>
            </div>
            <div class="container" >
                <button type="button" id="addMovie">Add Movie / Tv-Series</button>
                 <button type="button" id="showMovieList">Open WatchList</button>                 
            </div>
          
        </div>
    </header>
    <main>
        <section id="home" class="homepage">
            <h1 class="homepage">Click on above buttons to use the features</h1>
        </section>
        <section id="movieform" class="d-none form-bg">
            <div class="container my-5">
                <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <h2 class="mb-4">Add to Watchlist</h2>
                    <form id="movie-form-data">
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>

                    <!-- Type (radio) -->
                    <label class="form-label d-block">Type</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="type" id="movieType" value="Movie" required>
                        <label class="form-check-label" for="movieType">Movie</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="type" id="tvType" value="TV Show">
                        <label class="form-check-label" for="tvType">TV Show</label>
                    </div>

                    <!-- Year -->
                    <div class="mb-3">
                        <label for="year" class="form-label">Year</label>
                        <input type="number" class="form-control" id="year" name="year" required min="1880" max="2100">
                    </div>

                    <!-- Genre -->
                    <div class="mb-3">
                        <label for="genre" class="form-label">Genre</label>
                        <input type="text" class="form-control" id="genre" name="genre" required>
                    </div>

                    <!-- Status -->
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                        <option value="yet_to_watch" >Yet to Watch</option>
                        <option value="in_progress">In Progress</option>
                        <option value="need_rewatch">Need Rewatch</option>
                        <option value="watched">Watched</option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>

                    <!-- Cast -->
                    <div class="mb-3">
                        <label for="cast" class="form-label">Cast</label>
                        <input type="text" class="form-control" id="cast" name="cast" placeholder="Separate names with commas">
                    </div>

                    <button type="submit" class="btn btn-primary">Add to Watchlist</button>
                    </form>
                </div>
                </div>
            </div>
        </section>

        <section >
            <div class="container text-center d-none" id="hideClearbtn" >
            
                <div class="container" >
                    <button type="submit" id="clearList" class="btn btn-primary  clearbtn">Clear Watchlist</button>
                </div>
            </div>
            <div class="row text-center container width">
                
            </div>
            <section id="movieCards" class="container mt-4 flex-body d-none">

            </section>    

        </section>

        
    </main>
    <footer></footer>
    <script src="script.js"></script>
</body>
</html>
